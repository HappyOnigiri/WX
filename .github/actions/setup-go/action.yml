name: Set up pinned Go
description: Install the toolchain from go.mod with shared module and main-seeded build caches
inputs:
  cache-name:
    description: Cache namespace for the calling check
    required: true
  save-build-cache:
    description: Save a missing build cache entry after a trusted default-branch run
    required: false
    default: false
runs:
  using: composite
  steps:
    - id: setup-go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version-file: go.mod
        # setup-go's built-in key covers neither a caller-provided namespace nor
        # the source tree. Use the official setup action for toolchain
        # installation and the explicit cache actions below instead.
        cache: false
    - id: go-cache-paths
      name: Locate Go caches
      shell: bash
      run: |
        {
          echo "module=$(go env GOMODCACHE)"
          echo "build=$(go env GOCACHE)"
        } >> "$GITHUB_OUTPUT"
    - id: cache-keys
      name: Derive cache keys
      shell: bash
      env:
        # 依存関係はgo.sumだけで決まり、ビルドキャッシュはsource世代をまたいで共有する。
        DEPENDENCY_HASH: ${{ hashFiles('go.sum') }}
        RUNNER_PLATFORM: ${{ runner.os }}-${{ runner.arch }}
        GO_VERSION: ${{ steps.setup-go.outputs.go-version }}
        CACHE_NAME: ${{ inputs.cache-name }}
      run: |
        prefix="$RUNNER_PLATFORM-$GO_VERSION"
        {
          echo "module-prefix=wx-mod-$prefix-"
          echo "build-prefix=wx-build-v2-$prefix-$CACHE_NAME-"
          echo "dependency=$DEPENDENCY_HASH"
        } >> "$GITHUB_OUTPUT"
    # モジュールキャッシュは依存が変わるまで不変なので、全ジョブで同じキーを共有する。
    - name: Restore and save the Go module cache
      uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
      with:
        path: ${{ steps.go-cache-paths.outputs.module }}
        key: ${{ steps.cache-keys.outputs.module-prefix }}${{ steps.cache-keys.outputs.dependency }}
        restore-keys: ${{ steps.cache-keys.outputs.module-prefix }}
    # ビルドキャッシュはnamespaceごとにmainでseedし、PRなどは復元だけを行う。
    - name: Restore the Go build cache
      if: inputs.save-build-cache != 'true'
      uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
      with:
        path: ${{ steps.go-cache-paths.outputs.build }}
        key: ${{ steps.cache-keys.outputs.build-prefix }}${{ steps.cache-keys.outputs.dependency }}
    - name: Restore and save the Go build cache
      if: inputs.save-build-cache == 'true'
      uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
      with:
        path: ${{ steps.go-cache-paths.outputs.build }}
        key: ${{ steps.cache-keys.outputs.build-prefix }}${{ steps.cache-keys.outputs.dependency }}
