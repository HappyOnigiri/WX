name: Set up pinned Go
description: Install the toolchain from go.mod with a job-scoped cache
inputs:
  cache-name:
    description: Cache namespace for the calling check
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum
