name: Flake Hunt

# 調査用の一時ワークフローである。tmp/flake-hunt-* ブランチでのみ動かし、原因が判明したら削除する。
on:
  push:
    branches: ["tmp/flake-hunt-*"]

permissions:
  contents: read

concurrency:
  group: flake-hunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hunt:
    name: hunt ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: proof, mode: proof, procs: "0"}
          - {id: iso-1, mode: iso, procs: "0"}
          - {id: iso-2, mode: iso, procs: "0"}
          - {id: iso-3, mode: iso, procs: "0"}
          - {id: iso-4, mode: iso, procs: "0"}
          - {id: iso-5, mode: iso, procs: "0"}
          - {id: iso-6, mode: iso, procs: "0"}
          - {id: iso-7, mode: iso, procs: "2"}
          - {id: iso-8, mode: iso, procs: "2"}
          - {id: iso-9, mode: iso, procs: "1"}
          - {id: pkg-1, mode: pkg, procs: "0"}
          - {id: all-1, mode: all, procs: "0"}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-name: flake-hunt
      - name: Hunt the warm lease flake
        shell: bash
        env:
          HUNT_MODE: ${{ matrix.mode }}
          HUNT_PROCS: ${{ matrix.procs }}
          HUNT_DEADLINE: "2400"
        run: |
          set -u
          mkdir -p hunt-logs
          if [ "$HUNT_PROCS" != "0" ]; then
            export GOMAXPROCS="$HUNT_PROCS"
          fi
          test_args=(-race -timeout=25m)
          skip='^Test(ReconcileArtifactsQuarantinesInFlightReservation|StandbyBuiltBeforeFirstLeaseIsCold)$'
          case "$HUNT_MODE" in
            pkg)
              test_args+=(-shuffle=on -count=1 -skip "$skip" ./internal/daemon)
              ;;
            all)
              test_args+=(-shuffle=on -count=1 -skip "$skip" ./...)
              ;;
            iso)
              test_args+=(-count=20 -run '^TestWarmPoolMaintainsCapacityAndNeverDoubleLeases$' ./internal/daemon)
              ;;
            proof)
              test_args+=(-count=1 -run "$skip" ./internal/daemon)
              ;;
            *)
              echo "unknown mode: $HUNT_MODE" >&2
              exit 1
              ;;
          esac
          nproc
          go version
          start=$SECONDS
          round=0
          status=0
          while [ $((SECONDS - start)) -lt "$HUNT_DEADLINE" ]; do
            round=$((round + 1))
            log="hunt-logs/round-$round.log"
            echo "=== round $round starts at $((SECONDS - start))s"
            if go test "${test_args[@]}" >"$log" 2>&1; then
              tail -n 2 "$log"
              continue
            fi
            echo "=== FAILED in round $round"
            cat "$log"
            status=1
            break
          done
          echo "=== rounds=$round elapsed=$((SECONDS - start))s status=$status"
          exit "$status"
      - if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: hunt-logs-${{ matrix.id }}
          path: hunt-logs
          retention-days: 7
