name: Nightly

on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-go
        with: { cache-name: nightly-stress }
      - run: go test -race -shuffle=on -count=10 ./...

  fuzz:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/rpc
            target: FuzzReadFrame
          - package: ./internal/config
            target: FuzzDurationYAML
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-go
        with: { cache-name: "fuzz-${{ matrix.target }}" }
      - run: go test -run=^$ -fuzz='^${{ matrix.target }}$' -fuzztime=5m '${{ matrix.package }}'

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-go
        with: { cache-name: nightly-mutation }
      - run: go run github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 unleash
