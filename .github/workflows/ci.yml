name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [fmt-check, lint, deadcode, mod-tidy-check, reproducible-build, smoke]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with: { cache-name: "${{ matrix.target }}" }
      - run: make ${{ matrix.target }}
      - run: git diff --exit-code

  darwin:
    name: Darwin build (${{ matrix.arch }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with: { cache-name: "darwin-${{ matrix.arch }}" }
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=${{ matrix.arch }} go build -trimpath -o wx ./cmd/wx
      - run: if [ "$(go env GOARCH)" = "${{ matrix.arch }}" ]; then ./wx --help && ./wx --version; fi

  integration:
    name: Race, integration, and coverage
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with: { cache-name: integration-coverage }
      - run: make coverage-check
      - run: git diff --exit-code
      - if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: coverage
          path: coverage/all.out
          retention-days: 7

  required:
    name: CI required
    if: always()
    needs: [check, darwin, integration]
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.check.result }}' = success -a '${{ needs.darwin.result }}' = success -a '${{ needs.integration.result }}' = success
