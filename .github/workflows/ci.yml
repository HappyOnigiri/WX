name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          cache-name: static
      - name: Install pinned Go tools
        run: make setup-go-tools
      - name: Install markdown checker
        run: make setup-markdownlint
      - name: Install pinned ShellCheck
        env:
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output /tmp/shellcheck.tar.xz
          echo "$SHELLCHECK_SHA256  /tmp/shellcheck.tar.xz" | sha256sum --check
          tar -C /tmp -xf /tmp/shellcheck.tar.xz
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
      - run: make fmt-check
      - run: make lint
      - run: make deadcode
      - run: make mod-tidy-check
      - run: make generated-check
      - run: make docs-check
      - run: make workflow-check
      - run: make shell-check
      - name: Verify read-only check
        run: git diff --exit-code

  coverage:
    name: coverage
    runs-on: macos-15
    timeout-minutes: 15
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          cache-name: coverage
      - run: make coverage-check
      - run: git diff --exit-code

  build:
    name: build
    runs-on: macos-15
    timeout-minutes: 15
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-name: build
      - run: make build smoke build-darwin
      - name: Verify install from a temporary prefix
        run: |
          destination=$(mktemp -d)
          make install INSTALL_DIR="$destination"
          "$destination/wx" --help >/dev/null
          "$destination/wx" --version | grep -q '^wx version '
      - run: go version -m bin/wx
      - run: git diff --exit-code

  required:
    name: CI required
    if: always()
    needs: [static, coverage, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STATIC_RESULT: ${{ needs.static.result }}
      COVERAGE_RESULT: ${{ needs.coverage.result }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Require every CI job
        run: |
          # Every job listed in needs is required. There is no optional
          # availability branch for this aggregate check.
          for result in "$STATIC_RESULT" "$COVERAGE_RESULT" "$BUILD_RESULT"; do
            if [ "$result" != success ]; then
              echo "required CI dependency did not succeed: $result" >&2
              exit 1
            fi
          done
