name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'schedule' }}

permissions:
  contents: read

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          cache-name: static
      - name: Install pinned Go tools
        run: make setup-go-tools
      - name: Install markdown checker
        run: make setup-markdownlint
      - name: Install pinned ShellCheck
        env:
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output /tmp/shellcheck.tar.xz
          echo "$SHELLCHECK_SHA256  /tmp/shellcheck.tar.xz" | sha256sum --check
          tar -C /tmp -xf /tmp/shellcheck.tar.xz
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
      - run: make fmt-check
      - run: make lint
      - run: make deadcode
      - run: make mod-tidy-check
      - run: make generated-check
      - run: make docs-check
      - run: make comments-check
      - run: make workflow-check
      - run: make shell-check
      - name: Verify read-only check
        run: git diff --exit-code

  coverage-tests:
    name: coverage-tests
    runs-on: macos-15
    timeout-minutes: 15
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          cache-name: coverage
      - run: make coverage-check
      - run: git diff --exit-code

  # 3コアランナーではrace検査がCPU律速になり、単独で最長のinternal/daemonが下限を作る。
  # daemonと残りを別ランナーへ分け、待ち時間をその下限まで下げる。
  race:
    name: race (${{ matrix.shard }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [daemon, rest]
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          cache-name: race-${{ matrix.shard }}
      - env:
          RACE_SHARD: ${{ matrix.shard }}
        run: make "test-race-$RACE_SHARD"
      - run: git diff --exit-code

  # coverageは既存の必須チェック名を保つ集約ジョブである。
  # needs.race.resultはmatrixの全shardをまとめた結果になる。
  # どちらかがsuccess以外なら失敗させ、スキップやキャンセルを成功と見なさない。
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [coverage-tests, race]
    if: always()
    steps:
      - name: Require both macOS test jobs to succeed
        env:
          COVERAGE_TESTS_RESULT: ${{ needs.coverage-tests.result }}
          RACE_RESULT: ${{ needs.race.result }}
        run: |
          echo "coverage-tests=$COVERAGE_TESTS_RESULT race=$RACE_RESULT"
          test "$COVERAGE_TESTS_RESULT" = success
          test "$RACE_RESULT" = success

  build:
    name: build
    runs-on: macos-15
    timeout-minutes: 15
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-name: build
      - run: make build smoke build-darwin
      - name: Verify install from a temporary prefix
        run: |
          destination=$(mktemp -d)
          make install INSTALL_DIR="$destination"
          "$destination/wx" --help >/dev/null
          "$destination/wx" --version | grep -q '^wx version '
      - run: go version -m bin/wx
      - run: git diff --exit-code
