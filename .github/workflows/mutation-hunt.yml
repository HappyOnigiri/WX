name: Mutation Hunt

# 変異を手動で探索し、生存した判定だけをissueへ記録する。
on:
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to mutate (space-separated; empty means all packages)
        required: false
        default: ""
      groups:
        description: Number of shards for lightweight packages (1-20)
        required: false
        default: "4"
      workers:
        description: Gremlins workers per shard (1-16)
        required: false
        default: "2"
      timeout-coefficient:
        description: Gremlins timeout coefficient (1-100)
        required: false
        default: "12"
      job-timeout:
        description: Per-shard job timeout in minutes (30-360)
        required: false
        default: "360"
      mutators:
        description: Mutator set (boundary or default)
        required: false
        default: boundary
      file-issues:
        description: Create or update issues for surviving mutations
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# 手動で始めた探索を後続のdispatchで捨てないよう、実行中のrunは打ち切らない。
concurrency:
  group: mutation-hunt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the hunt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
      timeout: ${{ steps.plan.outputs.timeout }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/setup-go
        with:
          cache-name: mutation-hunt-plan
      - id: plan
        name: Validate inputs and build package matrix
        shell: bash
        env:
          HUNT_PACKAGES: ${{ inputs.packages }}
          HUNT_GROUPS: ${{ inputs.groups }}
          HUNT_WORKERS: ${{ inputs.workers }}
          HUNT_TIMEOUT_COEFFICIENT: ${{ inputs.timeout-coefficient }}
          HUNT_JOB_TIMEOUT: ${{ inputs.job-timeout }}
          HUNT_MUTATORS: ${{ inputs.mutators }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=Invalid input::$1"; exit 1; }
          case "$HUNT_GROUPS" in ''|*[!0-9]*) fail "groups must be a number";; esac
          case "$HUNT_WORKERS" in ''|*[!0-9]*) fail "workers must be a number";; esac
          case "$HUNT_TIMEOUT_COEFFICIENT" in ''|*[!0-9]*) fail "timeout-coefficient must be a number";; esac
          case "$HUNT_JOB_TIMEOUT" in ''|*[!0-9]*) fail "job-timeout must be a number";; esac
          [ "$HUNT_GROUPS" -ge 1 ] && [ "$HUNT_GROUPS" -le 20 ] || fail "groups must be 1-20"
          [ "$HUNT_WORKERS" -ge 1 ] && [ "$HUNT_WORKERS" -le 16 ] || fail "workers must be 1-16"
          [ "$HUNT_TIMEOUT_COEFFICIENT" -ge 1 ] && [ "$HUNT_TIMEOUT_COEFFICIENT" -le 100 ] || fail "timeout-coefficient must be 1-100"
          [ "$HUNT_JOB_TIMEOUT" -ge 30 ] && [ "$HUNT_JOB_TIMEOUT" -le 360 ] || fail "job-timeout must be 30-360"
          case "$HUNT_MUTATORS" in boundary|default) ;; *) fail "mutators must be boundary or default";; esac

          module=$(go list -m)
          to_local_packages() {
            while IFS= read -r import_path; do
              case "$import_path" in
                "$module") package=".";;
                "$module"/*) package="./${import_path#"$module"/}";;
                *) continue;;
              esac
              case "$package" in
                ./tools/*|./internal/testsupport) continue;;
              esac
              printf '%s\n' "$package"
            done
          }

          if [ -n "$HUNT_PACKAGES" ]; then
            selected_file=$(mktemp)
            trap 'rm -f "$selected_file"' EXIT
            read -r -a requested <<<"$HUNT_PACKAGES"
            for pattern in "${requested[@]}"; do
              listed=$(go list "$pattern") || fail "cannot resolve package pattern $pattern"
              printf '%s\n' "$listed" | to_local_packages >>"$selected_file"
            done
            mapfile -t packages < <(sort -u "$selected_file")
          else
            mapfile -t packages < <(go list ./... | to_local_packages | sort -u)
          fi
          ((${#packages[@]} > 0)) || fail "no packages selected"
          plan=$(printf '%s\n' "${packages[@]}" | node .github/scripts/mutation-plan.cjs --groups "$HUNT_GROUPS" --root "$GITHUB_WORKSPACE") || fail "cannot build mutation shard plan"
          while IFS=$'\t' read -r package reason; do
            [ -n "$package" ] || continue
            echo "::notice title=Mutation package excluded::$package: $reason"
          done < <(jq -r '.excluded[] | [.package, .reason] | @tsv' <<<"$plan")
          while IFS= read -r package; do
            [ -n "$package" ] || continue
            echo "::notice title=Mutation package unweighted::$package (using the weights median)"
          done < <(jq -r '.unweighted[]? // empty' <<<"$plan")
          matrix=$(jq -c '.matrix' <<<"$plan")
          (($(jq 'length' <<<"$matrix") > 0)) || fail "no packages remain after exclusions (internal/fdexec is not a mutation target)"
          go run ./tools/mutationreport -root "$GITHUB_WORKSPACE" -validate-exclusions || fail "mutation exclusions do not match source"
          {
            echo "matrix=$matrix"
            echo "shards=$matrix"
            echo "timeout=$HUNT_JOB_TIMEOUT"
          } >>"$GITHUB_OUTPUT"

  hunt:
    name: ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/setup-go
        with:
          cache-name: mutation-hunt-${{ matrix.id }}
      - name: Install mutation tools
        timeout-minutes: 10
        run: |
          make setup-mutation-tools
          mkdir -p .tools/bin
          go build -trimpath -o .tools/bin/mutationreport ./tools/mutationreport
          go build -trimpath -o .tools/bin/mutationshard ./tools/mutationshard
      - name: Run mutation hunt
        shell: bash
        env:
          HUNT_ID: ${{ matrix.id }}
          HUNT_PACKAGES: ${{ matrix.packages }}
          HUNT_WORKERS: ${{ inputs.workers }}
          HUNT_TIMEOUT_COEFFICIENT: ${{ inputs.timeout-coefficient }}
          HUNT_MUTATORS: ${{ inputs.mutators }}
          HUNT_RUN_ID: ${{ github.run_id }}
          HUNT_RUN_ATTEMPT: ${{ github.run_attempt }}
          HUNT_EXCLUDE_FILES: ${{ matrix.exclude_files }}
          HUNT_SHARD_COUNT: ${{ matrix.shard_count }}
          HUNT_SHARD_INDEX: ${{ matrix.shard_index }}
          HUNT_SHARD_FILES: ${{ matrix.shard_files }}
          HUNT_JOB_TIMEOUT: ${{ inputs.job-timeout }}
        run: |
          bash .github/scripts/run-mutation-shard.sh

      - name: Verify read-only hunt
        if: always()
        run: git diff --exit-code
      - if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: mutation-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mutation-artifacts/**/manifest.json
            mutation-artifacts/**/execution.json
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: mutation-diagnostics-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: mutation-artifacts/**/diagnostics
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Report mutation survivors
    needs: [plan, hunt]
    if: always()
    runs-on: ubuntu-24.04
    # 起票はsecondary rate limitで1件あたり数秒かかる。全パッケージ対象のhuntは
    # 数百グループを起票し得るため、10分では打ち切られる。
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: mutation-artifacts
      - if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const expectedShards = JSON.parse(process.env.EXPECTED_SHARDS);
            const reporter = require('./.github/scripts/report-mutants.cjs');
            await reporter.run({
              github,
              context,
              core,
              reportDir: 'mutation-artifacts',
              expectedShards,
              fileIssues: process.env.FILE_ISSUES !== 'false',
            });
        env:
          EXPECTED_SHARDS: ${{ needs.plan.outputs.shards }}
          FILE_ISSUES: ${{ inputs.file-issues }}
