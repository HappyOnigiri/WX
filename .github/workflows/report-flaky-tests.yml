name: Report flaky tests

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Source CI run ID
        required: true
        type: string
      run_attempt:
        description: Source CI run attempt
        required: true
        type: string

concurrency:
  group: wx-flaky-test-reports
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.run_attempt || github.event.workflow_run.run_attempt }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reporter = require('./.github/scripts/report-flaky-tests.cjs');
            await reporter.run({
              github,
              context,
              core,
              sourceRunId: process.env.SOURCE_RUN_ID,
              sourceAttempt: process.env.SOURCE_RUN_ATTEMPT,
            });
