version: "2"

linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - cyclop
    - depguard
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - gocritic
    - makezero
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    cyclop:
      max-complexity: 40
      package-average: 15
    depguard:
      rules:
        domain-boundary:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: github.com/HappyOnigiri/WorktreeX/internal
              desc: domain must not depend on adapters or orchestration
        sessions-boundary:
          files:
            - "**/internal/sessions/**"
          deny:
            - pkg: github.com/HappyOnigiri/WorktreeX/internal/config
              desc: sessions must not depend on wx orchestration or authoritative state
            - pkg: github.com/HappyOnigiri/WorktreeX/internal/cli
              desc: sessions must not depend on wx orchestration or authoritative state
            - pkg: github.com/HappyOnigiri/WorktreeX/internal/daemon
              desc: sessions must not depend on wx orchestration or authoritative state
            - pkg: github.com/HappyOnigiri/WorktreeX/internal/rpc
              desc: sessions must not depend on wx orchestration or authoritative state
            - pkg: github.com/HappyOnigiri/WorktreeX/internal/state
              desc: sessions must not depend on wx orchestration or authoritative state
            - pkg: github.com/HappyOnigiri/WorktreeX/internal/workspace
              desc: sessions must not depend on wx orchestration or authoritative state
            - pkg: github.com/HappyOnigiri/WorktreeX/internal/archive
              desc: sessions must not depend on wx orchestration or authoritative state
            - pkg: github.com/HappyOnigiri/WorktreeX/internal/pool
              desc: sessions must not depend on wx orchestration or authoritative state
        state-boundary:
          files:
            - "**/internal/state/**"
          deny:
            - pkg: github.com/HappyOnigiri/WorktreeX/internal/sessions
              desc: state must not depend on session history
            - pkg: github.com/HappyOnigiri/WorktreeX/internal/cli
              desc: state must not depend on CLI
            - pkg: github.com/HappyOnigiri/WorktreeX/internal/daemon
              desc: state must not depend on daemon orchestration
            - pkg: github.com/HappyOnigiri/WorktreeX/internal/rpc
              desc: state must not depend on RPC transport
            - pkg: github.com/HappyOnigiri/WorktreeX/internal/gitx
              desc: state must not depend on the Git adapter
            - pkg: github.com/HappyOnigiri/WorktreeX/internal/workspace
              desc: state must not depend on workspace preparation
    errcheck:
      exclude-functions:
        - (*database/sql.Tx).Rollback
        - (*database/sql.Rows).Close
        - (*os.File).Close
        - (io.Closer).Close
    exhaustive:
      check:
        - switch
    gocritic:
      enabled-tags:
        - diagnostic
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - errcheck
          - noctx

formatters:
  enable: [gofumpt, gci]
  settings:
    gci:
      sections: [standard, default, localmodule]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
